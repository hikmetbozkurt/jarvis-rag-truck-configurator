[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-truck-configurator"
version = "1.0.0"
description = "Local RAG assistant for truck configuration with hybrid retrieval, deterministic rule validation and retrieval observability."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hikmet Bozkurt Aydoğan" }]
dependencies = [
    "chromadb>=1.5,<2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3"]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.cli:run_command_line"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["jarvis"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
