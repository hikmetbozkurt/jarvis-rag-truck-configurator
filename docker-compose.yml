# Ollama runs on the host so it can use the Apple Silicon GPU (Metal); containers reach it via host.docker.internal.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      JARVIS_LLM_BASE_URL: http://host.docker.internal:11434
      JARVIS_LLM_MODEL_NAME: ${JARVIS_LLM_MODEL_NAME:-mistral}
      JARVIS_AUTO_INGEST_ON_STARTUP: "true"
      JARVIS_CORS_ALLOWED_ORIGINS: '["http://localhost:8080"]'
      JARVIS_LOG_AS_JSON: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jarvis-storage:/app/storage

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  jarvis-storage:
